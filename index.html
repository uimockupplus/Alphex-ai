<style>
:root{
  --paper:#f7f7f5;
  --white:#fff;
  --ink:#101010;
  --soft:#e9e9e5;
  --muted:#74746f;
  --border:#d4d4d0;

  --accent:#7057ff;
  --accent-dark:#5540d8;
  --cyan:#35c8c0;
  --lavender:#eeeaff;
  --mint:#e6f8f4;
  --sun:#f6c85f;

  --mono:'DM Mono',monospace;
  --sans:'Inter',Arial,sans-serif;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  transition:background .35s ease,color .35s ease;
}

.shell{
  width:min(1240px,calc(100% - 64px));
  margin:auto;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(247,247,245,.9);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(16,16,16,.08);
}

.nav{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.wordmark{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.075em;
  text-decoration:none;
  color:var(--ink);
}

.nav-links{
  display:flex;
  gap:28px;
  margin-left:100px;
}

.nav-links a{
  color:var(--ink);
  text-decoration:none;
  font-size:13px;
  transition:opacity .2s;
}

.nav-links a:hover{
  opacity:.5;
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  text-decoration:none;
  border-radius:999px;
  border:1px solid var(--ink);
  padding:11px 17px;
  color:var(--ink);
  font-size:12px;
  font-weight:600;
  transition:
    transform .2s,
    background .2s,
    color .2s,
    border-color .2s;
}

.pill:hover{
  transform:translateY(-2px);
}

.pill.dark{
  background:linear-gradient(110deg,var(--accent-dark),var(--accent));
  color:#fff;
  border-color:var(--accent-dark);
}

.pill.dark:hover{
  background:linear-gradient(110deg,#4532bd,var(--accent-dark));
}

.pill.light{
  border-color:var(--border);
}

.pill.light:hover{
  border-color:var(--accent);
  color:var(--accent-dark);
  background:var(--lavender);
}

.theme-toggle{
  height:39px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  border:1px solid var(--border);
  border-radius:999px;
  padding:0 12px;
  background:transparent;
  color:var(--ink);
  font:11px var(--mono);
  cursor:pointer;
  transition:.2s;
}

.theme-toggle:hover{
  border-color:var(--accent);
  background:var(--lavender);
  color:var(--accent-dark);
}

.theme-icon{
  font:17px var(--sans);
  line-height:1;
}

.mobile-menu{
  width:40px;
  height:40px;
  display:none;
  position:relative;
  border:1px solid var(--border);
  border-radius:50%;
  background:transparent;
  cursor:pointer;
}

.mobile-menu span{
  position:absolute;
  left:11px;
  width:16px;
  height:1.5px;
  background:var(--ink);
  transition:.2s;
}

.mobile-menu span:first-child{
  top:15px;
}

.mobile-menu span:last-child{
  top:22px;
}

.mobile-menu.open span:first-child{
  top:19px;
  transform:rotate(45deg);
}

.mobile-menu.open span:last-child{
  top:19px;
  transform:rotate(-45deg);
}

.mobile-panel{
  display:none;
  position:fixed;
  z-index:19;
  top:76px;
  left:0;
  right:0;
  background:rgba(247,247,245,.97);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  box-shadow:0 18px 35px rgba(0,0,0,.08);
}

.mobile-panel-inner{
  width:min(100% - 36px,620px);
  margin:auto;
  padding:13px 0 18px;
}

.mobile-panel a{
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--ink);
  text-decoration:none;
  font-size:19px;
  letter-spacing:-.04em;
  padding:14px 0;
  border-bottom:1px solid var(--border);
}

.mobile-panel a:last-child{
  border-bottom:0;
  color:var(--accent-dark);
}

.mobile-panel.open{
  display:block;
}

/* Announcement */

.announcement{
  padding:12px 0;
  border-bottom:1px solid rgba(16,16,16,.1);
  font-size:12px;
  text-align:center;
}

.announcement a{
  color:var(--accent-dark);
  text-decoration:underline;
  text-underline-offset:3px;
}

/* Ticker */

.ticker{
  overflow:hidden;
  border-bottom:1px solid var(--border);
  background:#eeecff;
  color:#4f40bb;
  white-space:nowrap;
}

.ticker-track{
  display:inline-flex;
  align-items:center;
  gap:27px;
  min-width:max-content;
  padding:12px 0;
  font:10px var(--mono);
  letter-spacing:.1em;
  animation:tickerMove 32s linear infinite;
}

.ticker b{
  color:#35bfb5;
  font-size:13px;
  font-weight:400;
}

@keyframes tickerMove{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* Hero */

.hero{
  padding:105px 0 90px;
  text-align:center;
}

.hero-kicker{
  font:11px var(--mono);
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--accent);
}

h1{
  max-width:1050px;
  margin:20px auto 28px;
  font-size:clamp(58px,9vw,128px);
  line-height:.9;
  letter-spacing:-.095em;
  font-weight:700;
}

h1 span{
  display:block;
}

.hero-copy{
  max-width:650px;
  margin:0 auto;
  color:#4f4f4b;
  font-size:18px;
  line-height:1.55;
}

.hero-actions{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:32px;
}

/* Hero visual */

.hero-stage{
  width:100%;
  height:520px;
  margin-top:78px;
  position:relative;
  overflow:hidden;
  border-radius:28px;
  background:
    linear-gradient(
      135deg,
      #1c1836 0%,
      #111 48%,
      #103f40 100%
    );
  box-shadow:0 24px 80px rgba(0,0,0,.16);
  display:flex;
  align-items:center;
  justify-content:center;
  --mx:0;
  --my:0;
}

.hero-stage:before{
  content:'';
  position:absolute;
  width:680px;
  height:680px;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 47% 46%,
      #f4f0ff 0 6%,
      #a79bff 11%,
      #7057ff 25%,
      #242044 51%,
      #10191a 72%
    );
  opacity:.95;
  transform:
    translate3d(
      calc(var(--mx) * -14px),
      calc(var(--my) * -14px),
      0
    );
  transition:transform .3s ease-out;
}

.hero-stage:after{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      120deg,
      transparent 0 40%,
      rgba(53,200,192,.26) 48%,
      transparent 56%
    );
  transform:translateX(-100%);
  animation:scan 7s ease-in-out infinite;
}

@keyframes scan{
  0%,20%{transform:translateX(-100%)}
  60%,100%{transform:translateX(100%)}
}

/* Product ecosystem visual */

.ecosystem-ui{
  position:relative;
  z-index:2;
  width:min(850px,82%);
  min-height:350px;
  border:1px solid rgba(166,156,255,.4);
  border-radius:20px;
  background:rgba(20,20,20,.72);
  backdrop-filter:blur(14px);
  padding:22px;
  color:#f4f4f0;
  box-shadow:0 30px 80px rgba(0,0,0,.35);

  transform:
    translate3d(
      calc(var(--mx) * 10px),
      calc(var(--my) * 10px),
      0
    )
    rotateX(calc(var(--my) * -1.5deg))
    rotateY(calc(var(--mx) * 1.5deg));

  transition:transform .18s ease-out;
}

.ecosystem-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:18px;
  border-bottom:1px solid rgba(255,255,255,.14);
  color:#a7a7a3;
  font:11px var(--mono);
}

.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--cyan);
  margin-left:auto;
  margin-right:10px;
  animation:statusPulse 1.8s ease-in-out infinite;
}

@keyframes statusPulse{
  50%{
    box-shadow:0 0 0 5px rgba(53,200,192,.12);
  }
}

.ecosystem-body{
  display:grid;
  grid-template-columns:1fr 1.4fr;
  gap:22px;
  padding-top:20px;
}

.alphex-core{
  border-right:1px solid rgba(255,255,255,.13);
  padding-right:22px;
}

.core-label{
  color:#8f8f8b;
  font:10px var(--mono);
  margin-bottom:17px;
}

.core-name{
  font-size:32px;
  font-weight:700;
  letter-spacing:-.07em;
  margin-bottom:10px;
}

.core-copy{
  color:#aaa;
  font-size:12px;
  max-width:260px;
}

.product-stack{
  display:grid;
  gap:11px;
}

.product-card{
  padding:15px 16px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.035);
  transition:.25s;
}

.product-card:hover{
  border-color:rgba(166,156,255,.55);
  transform:translateX(4px);
}

.product-card strong{
  display:block;
  font-size:15px;
  margin-bottom:4px;
}

.product-card span{
  color:#999;
  font-size:10px;
  font-family:var(--mono);
}

.product-card.loop-ai{
  background:linear-gradient(
    135deg,
    rgba(112,87,255,.23),
    rgba(53,200,192,.08)
  );
}

.product-card.loop-jobs{
  background:linear-gradient(
    135deg,
    rgba(246,200,95,.16),
    rgba(255,255,255,.03)
  );
}

/* General sections */

.section{
  padding:118px 0;
}

.intro{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:80px;
  align-items:start;
}

.section-label{
  font:11px var(--mono);
  color:var(--accent);
  text-transform:uppercase;
  letter-spacing:.08em;
}

.section-title{
  font-size:clamp(42px,5vw,72px);
  line-height:.98;
  letter-spacing:-.085em;
  margin:15px 0 0;
  font-weight:600;
}

.section-copy{
  max-width:470px;
  color:#595955;
  font-size:17px;
  line-height:1.55;
  margin-top:4px;
}

/* Products */

.product-stack-main{
  margin-top:72px;
  display:grid;
  gap:18px;
}

.product-feature{
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:450px;
  border-radius:25px;
  overflow:hidden;
  background:#fff;
}

.product-feature:nth-child(2){
  background:#e8f7f4;
}

.product-content{
  padding:44px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.product-number{
  font:11px var(--mono);
  color:var(--muted);
}

.product-content h3{
  font-size:44px;
  line-height:.98;
  letter-spacing:-.075em;
  margin:15px 0;
  max-width:390px;
}

.product-content p{
  max-width:410px;
  color:#595955;
  font-size:15px;
  line-height:1.6;
}

.product-meta{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:22px;
}

.meta-tag{
  border:1px solid #d4d4d0;
  border-radius:999px;
  padding:7px 10px;
  font:9px var(--mono);
  color:#656560;
}

.product-visual{
  position:relative;
  min-height:400px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.product-feature:first-child .product-visual{
  background:linear-gradient(135deg,#201a49,#7057ff);
}

.product-feature:nth-child(2) .product-visual{
  background:linear-gradient(135deg,#c8f0e8,#35c8c0);
  order:-1;
}

.visual-grid{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      transparent 49.8%,
      rgba(255,255,255,.18) 50%,
      transparent 50.2%
    ),
    linear-gradient(
      transparent 49.8%,
      rgba(255,255,255,.18) 50%,
      transparent 50.2%
    );
  background-size:70px 70px;
  opacity:.5;
  animation:gridDrift 12s linear infinite;
}

@keyframes gridDrift{
  to{background-position:70px 70px}
}

.product-orbit{
  position:absolute;
  width:330px;
  height:210px;
  border:1px solid rgba(255,255,255,.4);
  border-radius:50%;
  transform:rotate(30deg);
  animation:orbitSpin 14s linear infinite;
}

.product-orbit:before,
.product-orbit:after{
  content:'';
  position:absolute;
  inset:15%;
  border:1px solid rgba(255,255,255,.25);
  border-radius:50%;
}

.product-orbit:after{
  inset:28%;
}

@keyframes orbitSpin{
  to{
    rotate:360deg;
  }
}

.product-core{
  position:relative;
  z-index:2;
  width:100px;
  height:100px;
  border-radius:50%;
  background:#f7f5ff;
  box-shadow:0 0 95px rgba(238,234,255,.8);
  animation:corePulse 3.2s ease-in-out infinite;
}

@keyframes corePulse{
  0%,100%{
    box-shadow:0 0 75px rgba(238,234,255,.78);
  }
  50%{
    box-shadow:0 0 110px rgba(53,200,192,.42);
  }
}

.jobs-visual-window{
  width:72%;
  height:66%;
  border:1px solid rgba(16,16,16,.2);
  border-radius:16px;
  background:rgba(250,255,253,.72);
  padding:18px;
  box-shadow:0 25px 60px rgba(0,80,70,.16);
}

.jobs-window-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.jobs-window-title{
  font-size:13px;
  font-weight:700;
  letter-spacing:-.03em;
}

.jobs-window-status{
  font:9px var(--mono);
  color:#246d69;
}

.job-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid rgba(16,16,16,.1);
}

.job-icon{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#fff;
  display:grid;
  place-items:center;
  font:10px var(--mono);
}

.job-row strong{
  display:block;
  font-size:10px;
}

.job-row span{
  color:#777;
  font-size:8px;
}

/* Why */

.principles{
  background:
    linear-gradient(
      125deg,
      #14122b,
      #111 58%,
      #102b2b
    );
  color:#fff;
  padding:115px 0;
}

.principles-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:80px;
}

.principles .section-label{
  color:#8df0df;
}

.principles h2{
  font-size:clamp(46px,6vw,88px);
  line-height:.94;
  letter-spacing:-.09em;
  margin:16px 0;
}

.principles-copy{
  color:#aaa;
  font-size:16px;
  max-width:450px;
}

.principle-card{
  border:1px solid #4a4381;
  border-radius:20px;
  padding:27px;
  min-height:350px;
  background:rgba(255,255,255,.03);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.principle-log{
  font:11px var(--mono);
  color:#9e9e98;
}

.principle-list{
  display:grid;
  gap:15px;
}

.principle-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding-bottom:14px;
  border-bottom:1px solid #333;
}

.principle-row i{
  font-style:normal;
  display:grid;
  place-items:center;
  width:20px;
  height:20px;
  border:1px solid var(--cyan);
  color:var(--cyan);
  border-radius:50%;
  font-size:11px;
}

.principle-row span{
  font-size:14px;
}

/* Vision */

.vision{
  padding:120px 0;
}

.vision-grid{
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:100px;
}

.vision-list{
  border-top:1px solid var(--border);
}

.vision-item{
  padding:28px 0;
  border-bottom:1px solid var(--border);
}

.vision-item-top{
  display:flex;
  justify-content:space-between;
  gap:20px;
}

.vision-item-number{
  font:10px var(--mono);
  color:var(--accent);
}

.vision-item h3{
  margin:0;
  font-size:22px;
  letter-spacing:-.05em;
}

.vision-item p{
  max-width:600px;
  color:#656560;
  font-size:14px;
  line-height:1.6;
  margin:15px 0 0;
}

/* About */

.about-band{
  background:#e9e6ff;
  padding:115px 0;
}

.about-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:80px;
}

.about-band h2{
  font-size:clamp(48px,6vw,86px);
  line-height:.93;
  letter-spacing:-.09em;
  margin:15px 0;
}

.about-band p{
  color:#595955;
  max-width:470px;
  font-size:17px;
  line-height:1.6;
}

.about-note{
  border-left:2px solid var(--accent);
  padding-left:25px;
  align-self:center;
}

.about-note strong{
  display:block;
  font-size:22px;
  letter-spacing:-.04em;
  margin-bottom:10px;
}

.about-note span{
  color:#686564;
  font-size:14px;
}

/* CTA */

.cta{
  text-align:center;
  padding:135px 0 145px;
  background:
    linear-gradient(
      120deg,
      #161131,
      #111 60%,
      #103b3a
    );
  color:#fff;
}

.cta .section-label{
  color:#8df0df;
}

.cta h2{
  font-size:clamp(60px,9vw,128px);
  line-height:.88;
  letter-spacing:-.1em;
  margin:17px auto 30px;
  max-width:1050px;
}

.cta p{
  max-width:470px;
  color:#aaa;
  margin:0 auto 30px;
}

.cta .pill{
  background:linear-gradient(110deg,#fff,#dffbf5);
  color:#201942;
  border-color:#fff;
}

/* Footer */

.footer-pro{
  padding:72px 0 28px;
  border-top:1px solid var(--border);
}

.footer-top{
  display:grid;
  grid-template-columns:1.5fr 2.5fr;
  gap:80px;
  padding-bottom:75px;
}

.footer-brand p{
  max-width:280px;
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin:18px 0;
}

.footer-columns{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:24px;
}

.footer-group h4{
  font:10px var(--mono);
  color:var(--muted);
  letter-spacing:.08em;
  text-transform:uppercase;
  margin:0 0 20px;
}

.footer-group a{
  display:block;
  color:var(--ink);
  font-size:13px;
  text-decoration:none;
  margin:0 0 13px;
}

.footer-group a:hover{
  color:var(--accent-dark);
}

.footer-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-top:22px;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:11px;
}

.mono{
  font:10px var(--mono);
  color:var(--muted);
}

/* Dark mode */

.dark-theme{
  color-scheme:dark;
}

body.dark-theme{
  --paper:#0e1019;
  --white:#171a28;
  --ink:#f5f4ff;
  --soft:#262a3b;
  --muted:#a5a8bd;
  --border:#34394e;

  background:var(--paper);
}

body.dark-theme .topbar{
  background:rgba(14,16,25,.9);
  border-color:var(--border);
}

body.dark-theme .announcement{
  border-color:var(--border);
}

body.dark-theme .ticker{
  background:#201b46;
  border-color:var(--border);
  color:#c2baff;
}

body.dark-theme .mobile-panel{
  background:rgba(14,16,25,.97);
  border-color:var(--border);
}

body.dark-theme .hero-copy{
  color:#e1e3f0;
}

body.dark-theme .section-copy{
  color:#c2c5d5;
}

body.dark-theme .product-feature{
  background:#171a28;
  border:1px solid var(--border);
}

body.dark-theme .product-feature:nth-child(2){
  background:#171a28;
}

body.dark-theme .product-content p{
  color:#c0c3d2;
}
